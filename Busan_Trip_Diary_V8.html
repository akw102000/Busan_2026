if(window.L){map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let pts=[];
let locs=[];d.stops.forEach((s,j)=>{if(s.lat!=null&&s.lon!=null)locs.push({type:'plan',name:s.name,label:`${j+1}. ${s.name}`,lat:s.lat,lon:s.lon,url:s.url,detail:s.time})});foodBy(i).forEach(f=>locs.push({...f,type:'food',label:'🍜 '+f.name,detail:f.meal}));shopBy(i).forEach(s=>locs.push({...s,type:'shop',label:'🛍️ '+s.name,detail:s.note}));
locs.forEach((x,k)=>{let p=[x.lat,x.lon];pts.push(p);let short=x.name.length>9?x.name.slice(0,9)+'…':x.name;let icon=L.divIcon({html:`<span class="marker ${x.type}">${x.type==='plan'?'📍 '+short:x.type==='food'?'🍜 '+short:'🛍️ '+short}</span>`,className:'',iconSize:[110,28],iconAnchor:[16,14]});let m=L.marker(p,{icon}).addTo(map).bindPopup(`<b>${esc(x.name)}</b><br>${esc(x.detail)}<br><a href="${esc(x.url)}" target="_blank" rel="noopener">開啟 Naver Map ↗</a>`);});
if(pts.length>1)map.fitBounds(pts,{padding:[35,50],maxZoom:14});else if(pts.length===1)map.setView(pts[0],13);else map.setView([35.16,129.07],10);setTimeout(()=>map?.invalidateSize(),120)}else document.getElementById('map').textContent='需連網載入地圖；下方仍可使用 Naver Map 連結。';window.scrollTo({top:0,behavior:'instant'})}
